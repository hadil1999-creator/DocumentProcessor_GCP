name: Test DocumentProcessor_GCP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        cd DocumentProcessor_GCP
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        cd DocumentProcessor_GCP
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Syntax check Python files
      run: |
        cd DocumentProcessor_GCP
        python -m py_compile *.py

    - name: Test imports
      run: |
        cd DocumentProcessor_GCP
        python -c "import training_utils; import yaml; import automl_image; import automl_ner; import automl_objdetect; import automl_text; import final_view; import pdf2png; print('All imports successful')"

    - name: Validate config.yaml
      run: |
        cd DocumentProcessor_GCP
        python -c "import yaml; config = yaml.safe_load(open('config.yaml', 'r')); print('Config loaded successfully'); print(f'Project ID: {config[\"pipeline_project\"][\"project_id\"]}')"